<!doctype html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martín Villalobos — Portafolio de Ingeniería en Software</title>
  <meta name="description"
    content="Portafolio interactivo de Martín Villalobos, Desarrollador Full-Stack, Móvil y Datos. Sistemas web, arquitecturas backend, apps móviles y modelos de Machine Learning." />
  <meta property="og:title" content="Martín Villalobos — Portafolio de Ingeniería en Software" />
  <meta property="og:description"
    content="Portafolio interactivo de Martín Villalobos, Desarrollador Full-Stack, Móvil y Datos. Sistemas web, arquitecturas backend, apps móviles y modelos de Machine Learning." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="/icon/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet" />
</head>

<body class="bg-[#09090b] text-[#fafafa] antialiased selection:bg-[#a78bfa]/30 selection:text-[#fafafa]">
  <div id="particles-js" class="fixed inset-0 pointer-events-none z-0"></div>
  <div id="root" class="relative z-10"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- tsParticles CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
  <script>
    tsParticles.load("particles-js", {
      fullScreen: { enable: false },
      fpsLimit: 60,
      particles: {
        number: {
          value: 50,
          density: {
            enable: true,
            area: 800
          }
        },
        color: {
          value: ["#ffffff", "#cbd5e1"]
        },
        shape: {
          type: "circle"
        },
        opacity: {
          value: 0.3
        },
        size: {
          value: { min: 1, max: 2.5 }
        },
        links: {
          enable: true,
          distance: 140,
          color: "#cbd5e1",
          opacity: 0.3,
          width: 1
        },
        move: {
          enable: true,
          speed: 0.8,
          direction: "none",
          random: false,
          straight: false,
          outModes: {
            default: "out"
          }
        }
      },
      interactivity: {
        detectsOn: "window",
        events: {
          onHover: {
            enable: true,
            mode: "grab"
          },
          resize: true
        },
        modes: {
          grab: {
            distance: 160,
            links: {
              opacity: 0.5,
              color: "#ffffff"
            }
          }
        }
      },
      detectRetina: true
    });
  </script>
</body>

</html>
